[package]
name = "tungsten-wg"
version = "0.1.2"
edition = "2024"
description = "A compiler / code generator for world generation (Rust and CUDA)."
license = "MIT OR Apache-2.0"
repository = "https://github.com/NiekAukes/tungsten-wg"
keywords = ["minecraft", "worldgen", "compiler", "cuda", "codegen"]
categories = ["compilers"]
exclude = [
    ".git/",
    ".github/",

]

[workspace]
members = [
    "crates/tungsten-check",
    "crates/tungsten-codegen",
    "crates/tungsten-core",
    "crates/tungsten-cuda",
    "crates/tungsten-interface",
    "crates/tungsten-java",
    "crates/tungsten-inspect",
    "crates/tungsten-ir",
    "crates/tungsten-legacy",
    "crates/tungsten-optimizer",
    "crates/tungsten-parse",
    "crates/tungsten-rust",
]
resolver = "3"

[workspace.package]
version = "0.1.2"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/NiekAukes/tungsten-wg"

[workspace.dependencies]
bumpalo = "3.19.0"
codespan-reporting = { version = "0.13.1", default-features = false, features = ["std"] }
logos = "0.16.1"
md5 = "0.8.0"
proptest = "1.12.0"
stacker = "0.1.25"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0.40"
# Pinned together with VERUS_TAG in scripts/verify.sh (the script checks it).
vstd = "=0.0.0-2026-10-25-0158"
tungsten-ir = { path = "crates/tungsten-ir" }
tungsten-codegen = { path = "crates/tungsten-codegen" }
tungsten-interface = { path = "crates/tungsten-interface" }
tungsten-optimizer = { path = "crates/tungsten-optimizer" }
tungsten-rust = { path = "crates/tungsten-rust" }
tungsten-java = { path = "crates/tungsten-java" }
tungsten-cuda = { path = "crates/tungsten-cuda" }
tungsten-legacy = { path = "crates/tungsten-legacy" }
tungsten-inspect = { path = "crates/tungsten-inspect" }
tungsten-parse = { path = "crates/tungsten-parse" }
tungsten-core = { path = "crates/tungsten-core" }
tungsten-check = { path = "crates/tungsten-check" }

[features]
default = ["rust"]
rust = ["dep:tungsten-rust"]
java = ["dep:tungsten-java"]
inspect = ["dep:tungsten-inspect"]
cuda = ["dep:tungsten-cuda"]
parse = ["dep:tungsten-parse"]
check = ["dep:tungsten-check"]

[dependencies]
thiserror.workspace = true
tungsten-ir.workspace = true
tungsten-codegen.workspace = true
tungsten-interface.workspace = true
tungsten-optimizer.workspace = true
tungsten-legacy.workspace = true
tungsten-rust = { workspace = true, optional = true }
tungsten-java = { workspace = true, optional = true }
tungsten-inspect = { workspace = true, optional = true }
tungsten-cuda = { workspace = true, optional = true }
tungsten-parse = { workspace = true, optional = true }
tungsten-check = { workspace = true, optional = true }

[lib]
name = "tungsten_wg"
path = "src/lib.rs"