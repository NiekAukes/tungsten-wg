[package]
name = "tungsten-wg"
version = "0.1.2"
edition = "2024"
description = "A compiler / code generator for world generation (Rust and CUDA)."
license = "MIT OR Apache-2.0"
repository = "https://github.com/NiekAukes/tungsten-wg"
keywords = ["minecraft", "worldgen", "compiler", "cuda", "codegen"]
categories = ["compilers"]
exclude = [
    ".git/",
    ".github/",

]

[features]
default = []

[dependencies]
bumpalo = "3.19.0"
md5 = "0.8.0"
thiserror = "1.0.40"

[lib]
name = "tungsten_wg"
path = "src/lib.rs"